<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2E5C99">
<link rel="icon" href="https://raw.githubusercontent.com/ManuelVS8/Expresion_Escrita/refs/heads/main/Siurot_logo.png">
<title>Expresión_Profesorado</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap');
  :root{
    --blue-1:#2E5C99; --blue-2:#4A90D9; --blue-3:#6FB3E0;
    --orange-1:#FF6B35; --orange-2:#FF8C42;
    --ink:#1F3B57; --paper:#FFFFFF; --muted:#6B84A0;
    --green:#2FAE6E; --yellow:#E6A700; --red:#E85D5D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:'Nunito',sans-serif;
    background:linear-gradient(160deg, var(--blue-1), var(--blue-2) 55%, var(--blue-3));
    background-attachment:fixed; color:var(--ink);
    display:flex; justify-content:center;
  }
  .app{ width:100%; max-width:1000px; min-height:100vh; display:flex; flex-direction:column; }
  .content{ flex:1; padding:20px 24px 40px; }

  /* CABECERA */
  .topbar{
    display:flex; align-items:center; gap:10px;
    padding:14px 16px; color:#fff;
  }
  .topbar img{ width:34px; height:34px; border-radius:10px; background:#fff; padding:3px; }
  .topbar .who{ flex:1; }
  .topbar .who .nombre{ font-family:'Fredoka',sans-serif; font-size:14.5px; }
  .topbar .who .rol{ font-size:11px; opacity:.75; }
  .topbar button{
    background:rgba(255,255,255,.15); border:none; color:#fff;
    width:32px; height:32px; border-radius:50%; font-size:14px; cursor:pointer;
  }

  .card{
    background:var(--paper); border-radius:20px; padding:28px 32px;
    box-shadow:0 14px 34px rgba(15,45,80,.22); margin-bottom:14px;
  }
  .screen{display:none;} .screen.active{display:block; animation:fadeUp .3s ease;}
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  h2.title{ font-family:'Fredoka',sans-serif; font-size:18px; margin:0 0 4px; color:var(--blue-1); }
  p.subtitle{ margin:0 0 14px; font-size:13px; color:var(--muted); }

  label{ display:block; font-weight:700; font-size:12.5px; color:var(--blue-1); margin:10px 0 5px; }
  select, input[type=text], input[type=number], textarea{
    width:100%; border:2px solid #E3EBF3; border-radius:12px; padding:10px 12px;
    font-family:'Nunito',sans-serif; font-size:14.5px; background:#F8FAFD; color:var(--ink);
  }
  select:focus, input:focus, textarea:focus{ outline:none; border-color:var(--blue-2); }
  textarea{ min-height:90px; resize:vertical; }

  .btn{
    width:100%; border:none; border-radius:14px; padding:13px;
    font-family:'Fredoka',sans-serif; font-size:15px; font-weight:600; color:#fff;
    background:linear-gradient(135deg, var(--orange-1), var(--orange-2));
    box-shadow:0 8px 16px rgba(255,107,53,.3); cursor:pointer; margin-top:14px;
  }
  .btn.secondary{ background:#EEF3F9; color:var(--blue-1); box-shadow:none; }
  .btn.danger{ background:#FDECEC; color:var(--red); box-shadow:none; }
  .btn.small{ padding:8px; font-size:12.5px; margin-top:8px; }
  .btn:disabled{ opacity:.5; }

  .btn-google{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    background:#fff; color:#3c4043; border:2px solid #E3EBF3; border-radius:14px;
    padding:12px; font-family:'Nunito',sans-serif; font-weight:700; font-size:14.5px;
    cursor:pointer; margin-top:8px;
  }

  /* LISTAS */
  .row{
    display:flex; align-items:center; gap:10px; padding:12px 0;
    border-bottom:1px solid #EEF2F7;
  }
  .row:last-child{ border-bottom:none; }
  .row .info{ flex:1; min-width:0; }
  .row .nombre{ font-weight:800; font-size:14px; }
  .row .meta{ font-size:11.5px; color:var(--muted); }
  .codigo-chip{
    font-family:'Fredoka',sans-serif; font-size:12.5px; font-weight:600;
    background:#EEF6FF; color:var(--blue-1); padding:5px 10px; border-radius:10px;
    border:none; cursor:pointer; white-space:nowrap;
  }
  .badge{
    font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:8px;
  }
  .badge.ok{ background:#EAFAF1; color:var(--green); }
  .badge.pendiente{ background:#FFF3EC; color:var(--orange-1); }

  .fila-acciones{ display:flex; gap:8px; margin-top:10px; }
  .fila-acciones .btn{ margin-top:0; }
  .icon-btn{
    background:#F8FAFD; border:none; width:34px; height:34px; border-radius:10px;
    color:var(--blue-1); font-size:14px; cursor:pointer;
  }

  .empty{ text-align:center; color:var(--muted); font-size:13px; padding:20px 0; }

  /* NAV DE PESTAÑAS (arriba, propio de escritorio) */
  .bottom-nav{
    display:flex; gap:6px; margin:0 24px 14px; padding:4px;
    background:rgba(255,255,255,.15); border-radius:14px;
  }
  .nav-item{
    flex:1; text-align:center; padding:10px 0; background:none; border:none; border-radius:10px;
    font-family:'Nunito',sans-serif; font-size:13px; font-weight:700; color:#fff; cursor:pointer;
  }
  .nav-item .ic{ font-size:16px; margin-right:6px; }
  .nav-item.active{ background:#fff; color:var(--orange-1); }

  /* MODAL DE CONFIRMACIÓN (propio, sin confirm()) */
  .overlay{
    position:fixed; inset:0; background:rgba(15,30,50,.5);
    display:none; align-items:flex-end; justify-content:center; z-index:100;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:#fff; width:100%; max-width:640px; border-radius:22px 22px 0 0;
    padding:22px 20px 26px; animation:slideUp .25s ease;
  }
  @keyframes slideUp{ from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .modal h3{ font-family:'Fredoka',sans-serif; font-size:16px; margin:0 0 8px; color:var(--blue-1); }
  .modal p{ font-size:13.5px; color:var(--muted); margin:0 0 4px; line-height:1.5; }

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:14px;
    font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:.25s;
    max-width:88%; text-align:center; z-index:120;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* DETALLE ENTREGA */
  .texto-alumno{
    background:#F8FAFD; border-radius:14px; padding:14px; font-size:13.5px;
    line-height:1.6; white-space:pre-wrap; margin:8px 0 14px; max-height:280px; overflow-y:auto;
  }
  .dim-mini{ display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; }
  .aviso-ia{
    font-size:11.5px; color:var(--muted); background:#FFF9EF; border-radius:10px;
    padding:8px 10px; margin:10px 0;
  }

  .barra-wrap{ display:flex; align-items:flex-end; gap:6px; height:110px; margin:14px 0 6px; }
  .barra{ flex:1; background:linear-gradient(180deg, var(--orange-2), var(--orange-1)); border-radius:6px 6px 0 0; min-height:4px; }
  .barra-labels{ display:flex; gap:6px; font-size:9.5px; color:var(--muted); text-align:center; }
  .barra-labels span{ flex:1; }

  .loading-overlay{
    position:fixed; inset:0; background:rgba(15,30,50,.35);
    display:none; align-items:center; justify-content:center; z-index:200;
  }
  .loading-overlay.show{ display:flex; }
  .loading-box{
    background:#fff; border-radius:20px; padding:26px 30px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    box-shadow:0 14px 34px rgba(15,45,80,.3);
  }
  .gear-spin{
    font-size:36px; display:inline-block;
    animation:girar 1.1s linear infinite;
  }
  @keyframes girar{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .loading-box .msg{ font-size:13px; color:var(--muted); font-weight:700; }

  .promedio{ text-align:center; padding:6px 0 4px; }
  .promedio .num{ font-family:'Fredoka',sans-serif; font-size:34px; color:var(--blue-1); }
  .promedio .lbl{ font-size:12px; color:var(--muted); }

  .segmented{
    display:flex; background:#F0F4F9; border-radius:12px; padding:4px; margin-bottom:6px;
  }
  .seg-btn{
    flex:1; border:none; background:none; padding:9px 0; border-radius:9px;
    font-family:'Nunito',sans-serif; font-weight:700; font-size:13px; color:var(--muted); cursor:pointer;
  }
  .seg-btn.active{ background:#fff; color:var(--orange-1); box-shadow:0 3px 8px rgba(0,0,0,.08); }

  .clase-card{
    display:flex; align-items:center; gap:10px; padding:14px; border-radius:14px;
    background:#F8FAFD; margin-bottom:10px; cursor:pointer;
  }
  .clase-card .info{ flex:1; }
  .clase-card .nombre{ font-weight:800; font-size:14.5px; }
  .clase-card .meta{ font-size:11.5px; color:var(--muted); }
  .clase-card .flecha{ color:var(--blue-2); font-size:16px; }
</style>
</head>
<body>

<div class="app">

  <!-- LOGIN -->
  <div class="screen active" id="screen-login">
    <div class="content" style="display:flex; align-items:center; min-height:90vh;">
      <div class="card" style="width:100%; text-align:center;">
        <img src="https://raw.githubusercontent.com/ManuelVS8/Expresion_Escrita/refs/heads/main/Siurot_logo.png" alt="CEIP Manuel Siurot" style="width:64px; height:64px; border-radius:16px; margin-bottom:10px;">
        <h2 class="title">Panel del Profesorado</h2>
        <p class="subtitle">Expresión Escrita · C.E.I.P. Manuel Siurot</p>
        <div id="google-signin-btn" style="display:flex; justify-content:center; margin-top:10px;"></div>
        <p id="login-error" style="color:var(--red); font-size:12.5px; margin-top:10px; display:none;"></p>
      </div>
    </div>
  </div>

  <!-- APP PRINCIPAL (tras login) -->
  <div class="screen" id="screen-app">
    <div class="topbar">
      <img src="https://raw.githubusercontent.com/ManuelVS8/Expresion_Escrita/refs/heads/main/Siurot_logo.png" alt="">
      <div class="who">
        <div class="nombre" id="topbar-nombre">—</div>
        <div class="rol">Profesorado</div>
      </div>
      <button id="btn-logout" title="Cerrar sesión">⎋</button>
    </div>

    <div class="bottom-nav">
      <button class="nav-item active" data-tab="alumnado"><span class="ic">🧑‍🎓</span>Clases</button>
      <button class="nav-item" data-tab="entregas"><span class="ic">📄</span>Entregas</button>
      <button class="nav-item" data-tab="progreso"><span class="ic">📈</span>Progreso</button>
    </div>

    <div class="content">

      <!-- TAB: ALUMNADO (clases primero) -->
      <div class="tab-panel" id="tab-alumnado">
        <div class="card" id="vista-clases">
          <h2 class="title">Mis clases</h2>
          <p class="subtitle">Crea una clase a mano o importa el PDF de Séneca con todas tus clases.</p>
          <div id="lista-clases"><div class="empty">Cargando…</div></div>
          <button class="btn" id="btn-nueva-clase">+ Nueva clase</button>
          <button class="btn secondary" id="btn-importar-pdf">📄 Importar PDF de Séneca</button>
          <input type="file" id="input-pdf-seneca" accept="application/pdf" style="display:none;">
        </div>

        <div class="card" id="vista-alumnado-clase" style="display:none;">
          <button class="btn secondary small" id="btn-volver-clases">← Mis clases</button>
          <h2 class="title" id="titulo-clase-activa" style="margin-top:10px;">—</h2>
          <p class="subtitle" id="subtitulo-clase-activa"></p>
          <div id="lista-alumnado"><div class="empty">Cargando…</div></div>
          <button class="btn" id="btn-nuevo-alumno">+ Añadir alumno</button>
          <button class="btn secondary" id="btn-descargar-pdf-clase">⬇️ Descargar PDF con los códigos</button>
        </div>
      </div>

      <!-- TAB: ENTREGAS -->
      <div class="tab-panel" id="tab-entregas" style="display:none;">
        <div class="card">
          <h2 class="title">Entregas</h2>
          <label for="filtro-curso">Filtrar por curso</label>
          <select id="filtro-curso">
            <option value="">Todos los cursos</option>
            <option value="1">1º</option><option value="2">2º</option><option value="3">3º</option>
            <option value="4">4º</option><option value="5">5º</option><option value="6">6º</option>
          </select>
          <div id="lista-entregas" style="margin-top:8px;"><div class="empty">Cargando…</div></div>
        </div>
      </div>

      <!-- TAB: PROGRESO -->
      <div class="tab-panel" id="tab-progreso" style="display:none;">
        <div class="card">
          <h2 class="title">Progreso</h2>
          <div class="segmented" id="progreso-modo">
            <button class="seg-btn active" data-modo="grupo">Por grupo</button>
            <button class="seg-btn" data-modo="individual">Individual</button>
          </div>

          <div id="progreso-filtro-grupo">
            <label for="progreso-clase">Clase</label>
            <select id="progreso-clase">
              <option value="">Todas mis clases</option>
            </select>
          </div>

          <div id="progreso-filtro-individual" style="display:none;">
            <label for="progreso-alumno">Alumno/a</label>
            <select id="progreso-alumno"></select>
          </div>

          <div class="promedio">
            <div class="num" id="promedio-num">—</div>
            <div class="lbl" id="promedio-lbl">nota media</div>
          </div>
          <div class="barra-wrap" id="barra-wrap"></div>
          <div class="barra-labels" id="barra-labels"></div>
          <p class="empty" id="progreso-empty" style="display:none;">Todavía no hay entregas para mostrar.</p>
        </div>
      </div>

    </div>
  </div>

</div>

<!-- MODAL genérico (confirmaciones y formularios) -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal-contenido"></div>
</div>

<div class="toast" id="toast"></div>

<div class="loading-overlay" id="loading-overlay">
  <div class="loading-box">
    <span class="gear-spin">⚙️</span>
    <div class="msg" id="loading-msg">Cargando…</div>
  </div>
</div>

<script>
/* ==========================================================
   CONFIGURACIÓN
   ========================================================== */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbycHMDWfh8mkTEkmHISuLdH0b8c5qybyq2GfUeO1lPpjphUFF4o2kSdlaGxN9F-EWJC3A/exec';

// El MISMO Client ID que hayas puesto en GOOGLE_CLIENT_ID dentro de Code.gs
const GOOGLE_CLIENT_ID = '675015124931-qv0m0c5apck8hrhoq07omt850165f41n.apps.googleusercontent.com';

/* ========================================================== */

let sesion = { token: null, profesorId: null, nombre: null };
let cacheAlumnado = [];
let cacheEntregas = [];
let cacheClases = [];
let claseActiva = null;

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2600);
}

function mostrarCargando(msg = 'Cargando…'){
  document.getElementById('loading-msg').textContent = msg;
  document.getElementById('loading-overlay').classList.add('show');
}
function ocultarCargando(){
  document.getElementById('loading-overlay').classList.remove('show');
}

async function llamarBackend(action, datos = {}){
  if(APPS_SCRIPT_URL.includes('PEGA_AQUI')){
    showToast('Falta conectar la URL del backend todavía');
    return { ok:false, error:'Backend no configurado' };
  }
  try{
    const resp = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // evita problemas de CORS con Apps Script
      body: JSON.stringify({ action, token: sesion.token, ...datos })
    });
    return await resp.json();
  }catch(err){
    return { ok:false, error:'No se pudo conectar con el servidor' };
  }
}
/* ---------- MODAL genérico ---------- */
function abrirModal(html){
  document.getElementById('modal-contenido').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function cerrarModal(){
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'overlay') cerrarModal();
});

function confirmar(titulo, texto, onConfirmar){
  abrirModal(`
    <h3>${titulo}</h3>
    <p>${texto}</p>
    <button class="btn danger" id="modal-confirmar">Sí, continuar</button>
    <button class="btn secondary" id="modal-cancelar">Cancelar</button>
  `);
  document.getElementById('modal-confirmar').addEventListener('click', ()=>{ cerrarModal(); onConfirmar(); });
  document.getElementById('modal-cancelar').addEventListener('click', cerrarModal);
}

/* ---------- LOGIN (Google Identity Services, sin redirección) ---------- */
async function manejarCredencialGoogle(response){
  const errorEl = document.getElementById('login-error');
  errorEl.style.display = 'none';
  mostrarCargando('Entrando…');
  try{
    const respuesta = await llamarBackend('login', { idToken: response.credential });
    if(!respuesta.ok){
      ocultarCargando();
      errorEl.textContent = respuesta.error || 'No se pudo iniciar sesión';
      errorEl.style.display = 'block';
      return;
    }
    sesion = { token: respuesta.token, profesorId: respuesta.profesorId, nombre: respuesta.nombre };
    document.getElementById('topbar-nombre').textContent = sesion.nombre;
    document.getElementById('screen-login').classList.remove('active');
    document.getElementById('screen-app').classList.add('active');
    await Promise.all([cargarAlumnado(), cargarEntregas()]);
    ocultarCargando();
  }catch(err){
    ocultarCargando();
    errorEl.textContent = 'Error: ' + (err.message || 'desconocido');
    errorEl.style.display = 'block';
  }
}

function iniciarBotonGoogle(){
  if(typeof google === 'undefined'){
    setTimeout(iniciarBotonGoogle, 300); // el script de Google puede tardar un poco en cargar
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: manejarCredencialGoogle
    // hd quitado temporalmente para descartar que sea la causa del invalid_client
  });
  google.accounts.id.renderButton(
    document.getElementById('google-signin-btn'),
    { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill' }
  );
}
iniciarBotonGoogle();

document.getElementById('btn-logout').addEventListener('click', ()=>{
  confirmar('Cerrar sesión', '¿Seguro que quieres salir del panel?', ()=>{
    sesion = { token:null, profesorId:null, nombre:null };
    document.getElementById('screen-app').classList.remove('active');
    document.getElementById('screen-login').classList.add('active');
  });
});

/* ---------- NAVEGACIÓN INFERIOR ---------- */
document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p=>p.style.display='none');
    document.getElementById('tab-' + btn.dataset.tab).style.display='block';
    if(btn.dataset.tab === 'progreso'){ poblarSelectoresProgreso(); dibujarProgreso(); }
  });
});

/* ---------- TAB ALUMNADO (clases) ---------- */
async function cargarClases(){
  const r = await llamarBackend('listarClases');
  const cont = document.getElementById('lista-clases');
  if(!r.ok){ cont.innerHTML = `<div class="empty">${r.error || 'No se pudo cargar'}</div>`; return; }
  cacheClases = r.clases || [];
  if(cacheClases.length === 0){
    cont.innerHTML = '<div class="empty">Todavía no has creado ninguna clase.<br>Crea la primera para empezar a añadir alumnado.</div>';
    return;
  }
  cont.innerHTML = cacheClases.map(c => {
    const n = cacheAlumnado.filter(a=>a.claseId===c.id).length;
    return `
      <div class="clase-card">
        <div class="info" data-abrir="${c.id}" style="cursor:pointer;">
          <div class="nombre">${c.nombre}</div>
          <div class="meta">${c.curso}º de Primaria · ${n} alumno${n===1?'':'s'}</div>
        </div>
        <button class="icon-btn" data-editar-clase="${c.id}">✏️</button>
        <button class="icon-btn" data-eliminar-clase="${c.id}">🗑️</button>
      </div>`;
  }).join('');
  cont.querySelectorAll('[data-abrir]').forEach(el=>{
    el.addEventListener('click', ()=> abrirClase(el.dataset.abrir));
  });
  cont.querySelectorAll('[data-editar-clase]').forEach(el=>{
    el.addEventListener('click', ()=> abrirEdicionClase(el.dataset.editarClase));
  });
  cont.querySelectorAll('[data-eliminar-clase]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const clase = cacheClases.find(c=>c.id===el.dataset.eliminarClase);
      const n = cacheAlumnado.filter(a=>a.claseId===clase.id).length;
      confirmar('Eliminar clase',
        `¿Eliminar "${clase.nombre}"? ${n>0 ? `Se eliminarán también sus ${n} alumnos y sus códigos.` : ''} Esta acción no se puede deshacer.`,
        async ()=>{
          const r = await llamarBackend('eliminarClase', { claseId: clase.id });
          if(r.ok){ showToast('Clase eliminada'); await cargarAlumnado(); }

/* ---------- IMPORTAR PDF DE SÉNECA ---------- */
if(typeof pdfjsLib !== 'undefined'){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

async function extraerTextoPDF(file){
  if(typeof pdfjsLib === 'undefined'){
    throw new Error('El lector de PDF no se pudo cargar. Necesitas conexión a internet para usar esta opción.');
  }
  const buffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  let textoCompleto = '';
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();

    // Agrupamos por línea según la coordenada Y (redondeada), sin asumir
    // que los elementos llegan en orden de lectura — algunos generadores
    // de PDF (como JasperReports, el de Séneca) no lo garantizan.
    const grupos = [];
    content.items.forEach(item=>{
      const y = Math.round(item.transform[5]);
      let grupo = grupos.find(g => Math.abs(g.y - y) < 3);
      if(!grupo){ grupo = { y, items: [] }; grupos.push(grupo); }
      grupo.items.push(item);
    });
    grupos.sort((a,b) => b.y - a.y); // de arriba a abajo
    const lineasPagina = grupos.map(g=>{
      g.items.sort((a,b) => a.transform[4] - b.transform[4]); // de izquierda a derecha
      return g.items.map(it=>it.str).join(' ');
    });
    textoCompleto += lineasPagina.join('\n') + '\n';
  }
  return textoCompleto;
}

/**
 * Reconoce el formato del "Listado de clase por unidades" de Séneca:
 * separa cada clase por su cabecera "LISTA DE CLASE DE X ( Yº ... )"
 * y dentro extrae filas "Nº Apellidos, Nombre", ignorando cabeceras/pies.
 */
function parsearSeneca(texto){
  const lineas = texto.split('\n').map(l=>l.trim()).filter(Boolean);
  const clases = [];
  let claseActual = null;

  const reCabecera = /^LISTA DE CLASE DE\s+(.+?)\s*\(\s*(\d)º/i;
  const reAlumno = /^(\d{1,3})\s+(.+?)\s*,\s*(.+)$/;
  const reRuido = /^(Cod\.Centro|AÑO ACADÉMICO|TUTOR\/A|Nº orden|La Palma del Condado|Pág\.|Fecha Generaci)/i;

  for(const linea of lineas){
    const mCab = linea.match(reCabecera);
    if(mCab){
      claseActual = { nombre: mCab[1].replace(/\s+/g,''), curso: mCab[2], alumnado: [] };
      clases.push(claseActual);
      continue;
    }
    if(!claseActual || reRuido.test(linea)) continue;
    const mAl = linea.match(reAlumno);
    if(mAl){
      claseActual.alumnado.push(`${mAl[3].trim()} ${mAl[2].trim()}`);
    }
  }
  return clases;
}

          </select>

    <button class="btn secondary" id="preview-cancelar">Cancelar</button>
  `);

      clases[i].alumnado.splice(j, 1);

    });

  document.getElementById('preview-cancelar').addEventListener('click', cerrarModal);
  document.getElementById('preview-confirmar').addEventListener('click', async ()=>{
    document.querySelectorAll('.prev-nombre').forEach(inp => clases[inp.dataset.i].nombre = inp.value.trim());

async function dibujarProgreso(){
  const r = await llamarBackend('historialProfesor', { filtros: {} });
  const wrap = document.getElementById('barra-wrap');
  const labels = document.getElementById('barra-labels');
  const vacio = document.getElementById('progreso-empty');
  const promedioEl = document.getElementById('promedio-num');
  const promedioLbl = document.getElementById('promedio-lbl');

  if(!r.ok || !r.historial){ return; }
  let historial = r.historial;

  if(progresoModo === 'grupo'){
    const claseId = document.getElementById('progreso-clase').value;
    if(claseId){
      const codigosDeClase = cacheAlumnado.filter(a=>a.claseId===claseId).map(a=>a.codigo);
      historial = historial.filter(h => codigosDeClase.includes(h.codigo));
    }
    promedioLbl.textContent = claseId ? 'nota media de la clase' : 'nota media de todas tus clases';
  } else {
    const codigo = document.getElementById('progreso-alumno').value;
    historial = historial.filter(h => h.codigo === codigo);
    const alumno = cacheAlumnado.find(a=>a.codigo===codigo);
    promedioLbl.textContent = alumno ? `nota media de ${alumno.nombre}` : 'nota media';
  }

  if(historial.length === 0){
    wrap.innerHTML = ''; labels.innerHTML = ''; promedioEl.textContent = '—';
    vacio.style.display = 'block';
    return;
  }
  vacio.style.display = 'none';

  const ultimas = historial.slice(-10);
  const media = ultimas.reduce((s,h)=> s + Number(h.notaFinal || 0), 0) / ultimas.length;
  promedioEl.textContent = media.toFixed(1);

  wrap.innerHTML = ultimas.map(h => {
    const alto = Math.max(4, (Number(h.notaFinal || 0) / 10) * 100);
    return `<div class="barra" style="height:${alto}%" title="${h.notaFinal}/10"></div>`;
  }).join('');
  labels.innerHTML = ultimas.map(h =>
    `<span>${new Date(h.fecha).toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit'})}</span>`
  ).join('');
}
document.getElementById('progreso-clase').addEventListener('change', dibujarProgreso);
document.getElementById('progreso-alumno').addEventListener('change', dibujarProgreso);
</script>
</body>
</html>
